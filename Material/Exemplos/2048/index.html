<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>2048</title>
  <link rel="stylesheet" type="text/css" href="styles.css">
</head>
<body>
  <main>
    <header>
      <h1>2048</h1>
      <div class="scores">
        <div class="score"><small>Pontos</small><b id="score">0</b></div>
        <div class="score"><small>Recorde</small><b id="best">0</b></div>
      </div>
    </header>
    <div class="bar">
      <p>Junte números iguais para chegar ao 2048. Use as setas ou deslize.</p>
      <button id="restart">Novo jogo</button>
    </div>
    <div id="board" aria-label="Tabuleiro do 2048">
      <div id="msg"><h2 id="msgTitle"></h2><div><button id="msgBtn"></button><button id="msgNew">Novo jogo</button></div></div>
    </div>
  </main>
  <script src="game.js"></script>
</body>
</html>
